# Canonical single-file stack. Only Nginx publishes host port 80.
# Preserve existing ./data bind mounts and optional provider volumes.
x-node-build: &node-build
  context: .
  dockerfile: Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    container_name: agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_rag
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    expose:
      - "5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:rw
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentic -d agentic_rag"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 24

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    container_name: agentic-redis
    restart: unless-stopped
    # Context is rebuildable from PostgreSQL; streams remain durable enough for
    # worker recovery while Redis protects itself from unbounded growth.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        set -- --appendonly yes --appendfsync everysec --save "" --maxmemory "${REDIS_MAXMEMORY:-256mb}" --maxmemory-policy "${REDIS_MAXMEMORY_POLICY:-noeviction}" --tcp-keepalive 60
        if [ -n "$$REDIS_PASSWORD" ]; then set -- "$$@" --requirepass "$$REDIS_PASSWORD"; fi
        exec redis-server "$$@"
    expose:
      - "6379"
    volumes:
      - ./data/redis:/data:rw
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:latest@sha256:dd580fe1ab6e99e85bc66f2acf8bc8c5e9409fbe61b2e2803c5024403ef52833
    container_name: n8n
    restart: unless-stopped
    expose:
      - "5678"
    environment:
      N8N_HOST: "${N8N_HOST:-localhost}"
      N8N_PORT: "${N8N_PORT:-5678}"
      N8N_PROTOCOL: "${N8N_PROTOCOL:-http}"
      N8N_PATH: "/n8n/"
      N8N_PROXY_HOPS: "1"
      N8N_EDITOR_BASE_URL: "${PUBLIC_ORIGIN:-http://localhost}/n8n/"
      N8N_WEBHOOK_URL: "${PUBLIC_ORIGIN:-http://localhost}/n8n/"
      N8N_SECURE_COOKIE: "${N8N_SECURE_COOKIE:-false}"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: ${N8N_INSTANCE_OWNER_MANAGED_BY_ENV:-false}
      N8N_INSTANCE_OWNER_EMAIL: ${N8N_INSTANCE_OWNER_EMAIL:-}
      N8N_INSTANCE_OWNER_PASSWORD_HASH: ${N8N_INSTANCE_OWNER_PASSWORD_HASH:-}
      N8N_INSTANCE_OWNER_FIRST_NAME: ${N8N_INSTANCE_OWNER_FIRST_NAME:-Admin}
      N8N_INSTANCE_OWNER_LAST_NAME: ${N8N_INSTANCE_OWNER_LAST_NAME:-TechCarrot}
      N8N_WEBHOOK_SECRET: "${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET required}"
      REMOTE_CRM_PROVIDER: ${REMOTE_CRM_PROVIDER-}
      REMOTE_CRM_LEAD_URL: ${REMOTE_CRM_LEAD_URL-}
      REMOTE_CRM_LEAD_READ_URL: ${REMOTE_CRM_LEAD_READ_URL-}
      REMOTE_CRM_LEAD_UPDATE_URL: ${REMOTE_CRM_LEAD_UPDATE_URL-}
      REMOTE_CRM_ATTACHMENT_URL: ${REMOTE_CRM_ATTACHMENT_URL-}
      REMOTE_CRM_ATTACHMENT_READ_URL: ${REMOTE_CRM_ATTACHMENT_READ_URL-}
      REMOTE_CRM_ACCOUNT_URL: ${REMOTE_CRM_ACCOUNT_URL-}
      REMOTE_CRM_ACCOUNT_READ_URL: ${REMOTE_CRM_ACCOUNT_READ_URL-}
      REMOTE_CRM_CONTACT_READ_URL: ${REMOTE_CRM_CONTACT_READ_URL-}
      REMOTE_CRM_OPPORTUNITY_READ_URL: ${REMOTE_CRM_OPPORTUNITY_READ_URL-}
      REMOTE_CRM_LEAD_ID_PATTERN: ${REMOTE_CRM_LEAD_ID_PATTERN-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Asia/Dubai
      TZ: Asia/Dubai
    volumes:
      - ./data/n8n:/home/node/.n8n:rw
      - ./infra/n8n/workflows:/workflows:ro

  model-gateway:
    build:
      context: .
      dockerfile: services/model-gateway/Dockerfile
    restart: unless-stopped
    expose: ["8088"]
    environment:
      MODEL_MODE: ${MODEL_MODE:-azure}
      AI_PROVIDER: ${AI_PROVIDER:-azure}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AZURE_OPENAI_BASE_URL: ${AZURE_OPENAI_BASE_URL:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      MODEL_GATEWAY_SERVICE_KEY: ${MODEL_GATEWAY_SERVICE_KEY:?MODEL_GATEWAY_SERVICE_KEY required}
      NODE_TOOL_GATEWAY_URL: http://api:4000
      LANGGRAPH_CONVERSATION_ENABLED: "true"
      V2_DIAGNOSTIC_CAPTURE: ${V2_DIAGNOSTIC_CAPTURE:-false}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-2}
      MODEL_MIN_CALL_INTERVAL_SECONDS: ${MODEL_MIN_CALL_INTERVAL_SECONDS:-0.7}
      MODEL_MAX_REQUESTS_PER_MINUTE: ${MODEL_MAX_REQUESTS_PER_MINUTE:-60}
      MODEL_TURN_TIMEOUT_SECONDS: ${MODEL_TURN_TIMEOUT_SECONDS:-120}
      MODEL_MAX_QUEUE_DEPTH: ${MODEL_MAX_QUEUE_DEPTH:-4}
      MODEL_CIRCUIT_BREAKER_FAILURES: ${MODEL_CIRCUIT_BREAKER_FAILURES:-3}
      MODEL_CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${MODEL_CIRCUIT_BREAKER_COOLDOWN_SECONDS:-30}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8088/internal/health/ready',headers={'X-Internal-Service-Key':os.environ['MODEL_GATEWAY_SERVICE_KEY']}); urllib.request.urlopen(r,timeout=3).close()"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 15

  api:
    build:
      <<: *node-build
      target: api-runtime
    container_name: agentic-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    expose:
      - "4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      STORE: postgres
      DATABASE_URL: postgres://agentic:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/agentic_rag
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_CONTEXT_TTL_SECONDS: ${REDIS_CONTEXT_TTL_SECONDS:-86400}
      REDIS_CONTEXT_ABSOLUTE_TTL_SECONDS: ${REDIS_CONTEXT_ABSOLUTE_TTL_SECONDS:-604800}
      REDIS_INSTRUCTION_TTL_SECONDS: ${REDIS_INSTRUCTION_TTL_SECONDS:-3600}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-100000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      CHANNEL_CREDENTIAL_KEY: ${CHANNEL_CREDENTIAL_KEY:?CHANNEL_CREDENTIAL_KEY required}
      OMNI_CHANNEL_API_KEY: ${OMNI_CHANNEL_API_KEY:-}
      OMNI_CHANNEL_TENANT_ID: ${OMNI_CHANNEL_TENANT_ID:-}
      OMNI_CHANNEL_TENANT_SLUG: ${OMNI_CHANNEL_TENANT_SLUG:-}
      OMNI_CHANNEL_NAME: ${OMNI_CHANNEL_NAME:-omnichannel}
      OMNI_ALLOW_STATIC_API_KEY: ${OMNI_ALLOW_STATIC_API_KEY:-false}
      PII_VAULT_KEY: ${PII_VAULT_KEY:?PII_VAULT_KEY required}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      ADMIN_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT:-}
      AZURE_AI_EMBEDDING_DEPLOYMENT: ${AZURE_AI_EMBEDDING_DEPLOYMENT:-}
      AZURE_AI_EMBEDDING_DIMENSION: ${AZURE_AI_EMBEDDING_DIMENSION:-1536}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
      AZURE_AI_API_VERSION: ${AZURE_AI_API_VERSION:-2024-10-21}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-${AI_PROVIDER:-azure}}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      OPENAI_EMBEDDING_DIMENSION: ${OPENAI_EMBEDDING_DIMENSION:-1536}
      OPENAI_EMBEDDING_API_KEY: ${OPENAI_EMBEDDING_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-azure}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      N8N_INTERNAL_URL: http://n8n:5678
      NODE_INTERNAL_URL: ${NODE_INTERNAL_URL:-http://api:4000}
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET required}
      INGESTION_WORKER_SECRET: ${INGESTION_WORKER_SECRET:?INGESTION_WORKER_SECRET required}
      CHAT_STREAM_INTERNAL_SECRET: ${CHAT_STREAM_INTERNAL_SECRET:?CHAT_STREAM_INTERNAL_SECRET required}
      INGESTION_STAGING_ROOT: /app/data/ingestion-staging
      SUPPORTING_DOCUMENT_ROOT: /app/data/supporting-documents
      CHAT_RESPONSE_CACHE_TTL_SECONDS: ${CHAT_RESPONSE_CACHE_TTL_SECONDS:-60}
      CATALOG_QUERY_NORMALIZATION_ENABLED: ${CATALOG_QUERY_NORMALIZATION_ENABLED:-false}
      CHAT_SESSION_TTL_MS: ${CHAT_SESSION_TTL_MS:-600000}
      API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-600}
      API_RATE_LIMIT_WINDOW_MS: ${API_RATE_LIMIT_WINDOW_MS:-60000}
      CHAT_MODEL_PROVIDER: python-gpt
      CONVERSATION_ENGINE_V2_ENABLED: "true"
      CONVERSATION_ENGINE_V2_TENANTS: ${CONVERSATION_ENGINE_V2_TENANTS:-}
      CONVERSATION_ENGINE_V2_REQUIRED: "true"
      V2_DIAGNOSTIC_CAPTURE: ${V2_DIAGNOSTIC_CAPTURE:-false}
      PYTHON_MODEL_URL: http://model-gateway:8088
      MODEL_GATEWAY_SERVICE_KEY: ${MODEL_GATEWAY_SERVICE_KEY:?MODEL_GATEWAY_SERVICE_KEY required}
      PYTHON_MODEL_TIMEOUT_MS: ${PYTHON_MODEL_TIMEOUT_MS:-120000}
      CHAT_TURN_TIMEOUT_MS: ${CHAT_TURN_TIMEOUT_MS:-120000}
      V2_GROUNDING_ENTAILMENT_MODE: ${V2_GROUNDING_ENTAILMENT_MODE:-off}
      V2_GROUNDING_TIMEOUT_MS: ${V2_GROUNDING_TIMEOUT_MS:-10000}
      QUOTE_PDF_RENDER_URL: http://quote-pdf:8097/v1/render
      QUOTE_PDF_API_KEY: ${QUOTE_PDF_API_KEY:-}
      QUOTE_WORKFLOW_ENABLED: ${QUOTE_WORKFLOW_ENABLED:-true}
      MOCK_PAYMENT_INTERNAL_URL: http://mock-payments:8098
      MOCK_PAYMENT_API_KEY: ${MOCK_PAYMENT_API_KEY:-}
      REMOTE_CRM_PROVIDER: ${REMOTE_CRM_PROVIDER:-}
      REMOTE_CRM_LEAD_READ_URL: ${REMOTE_CRM_LEAD_READ_URL:-}
      REMOTE_CRM_ACCOUNT_READ_URL: ${REMOTE_CRM_ACCOUNT_READ_URL:-}
      REMOTE_CRM_CONTACT_READ_URL: ${REMOTE_CRM_CONTACT_READ_URL:-}
      REMOTE_CRM_OPPORTUNITY_READ_URL: ${REMOTE_CRM_OPPORTUNITY_READ_URL:-}
      REMOTE_CRM_ACCESS_TOKEN: ${REMOTE_CRM_ACCESS_TOKEN:-}
      REMOTE_CRM_TOKEN_URL: ${REMOTE_CRM_TOKEN_URL:-}
      REMOTE_CRM_CLIENT_ID: ${REMOTE_CRM_CLIENT_ID:-}
      REMOTE_CRM_CLIENT_SECRET: ${REMOTE_CRM_CLIENT_SECRET:-}
      V2_LEAD_WORKFLOW_READY: ${V2_LEAD_WORKFLOW_READY:-false}
      REMOTE_N8N_BASE_URL: ${REMOTE_N8N_BASE_URL:-}
      REMOTE_N8N_SALESFORCE_LEAD_PATH: ${REMOTE_N8N_SALESFORCE_LEAD_PATH:-/n8n/webhook/salesforce-lead}
      REMOTE_N8N_QUOTATION_PATH: ${REMOTE_N8N_QUOTATION_PATH:-/n8n/webhook/generate-quotation}
      REMOTE_N8N_QUOTATION_API_KEY: ${REMOTE_N8N_QUOTATION_API_KEY:-}
      REMOTE_N8N_QUOTE_API_KEY: ${REMOTE_N8N_QUOTE_API_KEY:-}
      REMOTE_N8N_QUOTE_ACCOUNT_ID: ${REMOTE_N8N_QUOTE_ACCOUNT_ID:-}
    volumes:
      - ./data/ingestion-staging:/app/data/ingestion-staging:rw
      - ./data/supporting-documents:/app/data/supporting-documents:rw
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 15

  event-relay:
    build:
      <<: *node-build
      target: api-runtime
    container_name: agentic-event-relay
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://agentic:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/agentic_rag
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-100000}
    command: ["node", "services/api/dist/event-relay.js"]

  event-worker:
    build:
      <<: *node-build
      target: api-runtime
    container_name: agentic-event-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgres://agentic:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/agentic_rag
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-100000}
      N8N_INTERNAL_URL: http://n8n:5678
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?N8N_WEBHOOK_SECRET required}
      N8N_DISPATCH_TIMEOUT_MS: ${N8N_DISPATCH_TIMEOUT_MS:-30000}
      N8N_COMPLETION_DEADLINE_MS: ${N8N_COMPLETION_DEADLINE_MS:-900000}
      EVENT_WORKER_STREAMS: ${EVENT_WORKER_STREAMS:-rag:v2:crm,rag:v2:documents,rag:v2:actions,rag:v2:notifications}
    command: ["node", "services/api/dist/event-worker.js"]

  web:
    build:
      <<: *node-build
      target: web-runtime
      args:
        NEXT_PUBLIC_API_URL: /
        AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-Azure GPT-4.1-mini}
    container_name: agentic-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  admin:
    build:
      <<: *node-build
      target: admin-runtime
      args:
        ADMIN_BASE_HREF: /admin/
    container_name: agentic-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"

  ingestion:
    build:
      <<: *node-build
      target: ingestion-runtime
    container_name: agentic-ingestion
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      INGESTION_API_BASE: http://api:4000
      INGESTION_WORKER_SECRET: ${INGESTION_WORKER_SECRET:?INGESTION_WORKER_SECRET required}
      INGESTION_POLL_INTERVAL_SECONDS: ${INGESTION_POLL_INTERVAL_SECONDS:-5}
      INGESTION_ZIP_MEMBER_DELAY_SECONDS: ${INGESTION_ZIP_MEMBER_DELAY_SECONDS:-1.0}
      INGESTION_LEASE_MS: ${INGESTION_LEASE_MS:-120000}
      INGESTION_RESULT_TIMEOUT_SECONDS: ${INGESTION_RESULT_TIMEOUT_SECONDS:-600}
    volumes:
      - ./data/ingestion-staging:/app/data/ingestion-staging:rw
      - ./data/supporting-documents:/app/data/supporting-documents:rw
    command: ["--staging-root", "/app/data/ingestion-staging"]

  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: agentic-nginx
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:80:80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started
      n8n:
        condition: service_started
    volumes:
      - ./infra/nginx/public.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Opt-in development-only provider simulators; no published host ports.
  quote-pdf:
    profiles: [quote]
    build:
      context: ./tools/anc/pdf_service
    restart: unless-stopped
    environment:
      QUOTE_PDF_ENABLED: "true"
      QUOTE_PDF_PRIVATE_DOCKER: "true"
      QUOTE_PDF_HOST: 0.0.0.0
      QUOTE_PDF_PORT: "8097"
      QUOTE_PDF_API_KEY: ${QUOTE_PDF_API_KEY:-}
      QUOTE_PDF_OUTPUT_ROOT: /var/lib/quote-pdf-private
    volumes:
      - quote_pdf_private:/var/lib/quote-pdf-private

  mock-payments:
    profiles: [quote]
    build:
      context: ./tools/anc/payment_mock
    restart: unless-stopped
    environment:
      MOCK_PAYMENTS_ENABLED: "true"
      MOCK_PAYMENT_PRIVATE_DOCKER: "true"
      MOCK_PAYMENT_HOST: 0.0.0.0
      MOCK_PAYMENT_PORT: "8098"
      MOCK_PAYMENT_API_KEY: ${MOCK_PAYMENT_API_KEY:-}
      MOCK_PAYMENT_DB: /var/lib/mockpay/mock-payments.sqlite3
    volumes:
      - mock_payment_private:/var/lib/mockpay

volumes:
  quote_pdf_private:
  mock_payment_private:
