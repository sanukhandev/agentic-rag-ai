# Development-only overlay for the EXISTING root docker-compose.yml.
# These services must remain private: NO ports: entries and no ingress routes.
# Usage after copying pack: docker compose -f docker-compose.yml -f infra/docker-compose.ancfz-dev.example.yml up -d --build
services:
  ancfz-pdf:
    build:
      context: ./tools/anc/pdf_service
    restart: unless-stopped
    environment:
      ANCFZ_PDF_ENABLED: 'true'
      ANCFZ_PDF_PRIVATE_DOCKER: 'true'
      ANCFZ_PDF_HOST: 0.0.0.0
      ANCFZ_PDF_PORT: '8097'
      ANCFZ_PDF_API_KEY: ${ANCFZ_PDF_API_KEY:?Set a 24+ character random dev-only key}
      ANCFZ_PDF_OUTPUT_ROOT: /var/lib/ancfz-private
    volumes:
      - ancfz_mock_pdf_private:/var/lib/ancfz-private
    networks:
      - default
  mock-payments:
    build:
      context: ./tools/anc/payment_mock
    restart: unless-stopped
    environment:
      MOCK_PAYMENTS_ENABLED: 'true'
      MOCK_PAYMENT_PRIVATE_DOCKER: 'true'
      MOCK_PAYMENT_HOST: 0.0.0.0
      MOCK_PAYMENT_PORT: '8098'
      MOCK_PAYMENT_API_KEY: ${MOCK_PAYMENT_API_KEY:?Set a 20+ character random dev-only key}
      MOCK_PAYMENT_DB: /var/lib/mockpay/mock-payments.sqlite3
    volumes:
      - ancfz_mock_payment_private:/var/lib/mockpay
    networks:
      - default
  api:
    environment:
      ANCFZ_PDF_INTERNAL_URL: http://ancfz-pdf:8097/v1/render
      MOCK_PAYMENT_INTERNAL_URL: http://mock-payments:8098
      ANCFZ_PDF_API_KEY: ${ANCFZ_PDF_API_KEY:?Set random dev-only key}
      MOCK_PAYMENT_API_KEY: ${MOCK_PAYMENT_API_KEY:?Set random dev-only key}
    depends_on:
      - ancfz-pdf
      - mock-payments
volumes:
  ancfz_mock_pdf_private: {}
  ancfz_mock_payment_private: {}
