map $http_host $n8n_origin_host {
  ~^(?<n8n_host_without_port>[^:]+):[0-9]+$ $n8n_host_without_port;
  default $http_host;
}

server {
  listen 3000 default_server;
  listen [::]:3000 default_server;
  server_name _;

  client_max_body_size 30m;

  location = /admin {
    return 301 /admin/;
  }

  location ^~ /admin/ {
    proxy_pass http://127.0.0.1:4200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /n8n {
    return 301 /n8n/;
  }

  location ^~ /n8n/ {
      proxy_pass http://127.0.0.1:5678/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $n8n_origin_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $n8n_origin_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /n8n;
    # n8n validates Origin against X-Forwarded-Host; keep both host-only for non-standard public ports.
    proxy_set_header Origin $scheme://$n8n_origin_host;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location ^~ /api/ {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
