# Single public entrypoint; dynamic Docker DNS avoids stale upstream IPs.
map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  client_max_body_size 30m;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port $server_port;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /admin { return 301 /admin/; }
  location ^~ /admin/ {
    set $admin_backend admin:80;
    proxy_pass http://$admin_backend;
  }
  location = /n8n { return 301 /n8n/; }
  location ^~ /n8n/ {
    set $n8n_backend n8n:5678;
    # Keep /n8n/ as configured in N8N_PATH.
    proxy_pass http://$n8n_backend;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Prefix /n8n;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
  location ^~ /api/ {
    set $api_backend api:4000;
    proxy_pass http://$api_backend;
    proxy_read_timeout 120s;
  }
  location / {
    set $web_backend web:3000;
    proxy_pass http://$web_backend;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 120s;
  }
}
