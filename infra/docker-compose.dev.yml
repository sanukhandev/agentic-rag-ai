services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentic_rag
      POSTGRES_USER: agentic
      POSTGRES_PASSWORD: agentic_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - agentic_pgdata:/var/lib/postgresql/data
      - ./postgres/001-schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  agentic_pgdata:
