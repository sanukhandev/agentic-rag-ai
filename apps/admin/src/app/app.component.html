<main class="mx-auto min-h-screen max-w-6xl px-6 py-10">
  <header class="mb-8"><p class="text-sm font-semibold uppercase tracking-[0.24em] text-indigo-600">Agentic RAG AI</p><h1 class="mt-2 text-4xl font-bold">Knowledge operations</h1><p class="mt-2 text-slate-600">Tenant administrators stage, review and publish source material. Authorization stays in the Node API.</p></header>
  <section *ngIf="!token" class="max-w-md rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"><h2 class="text-xl font-semibold">Tenant admin sign-in</h2><input [(ngModel)]="email" placeholder="Email" class="mt-4 w-full rounded-lg border px-3 py-2"><input [(ngModel)]="password" type="password" placeholder="Password" class="mt-3 w-full rounded-lg border px-3 py-2"><button (click)="login()" class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Sign in</button></section>
  <section *ngIf="token" class="grid gap-6 lg:grid-cols-[0.8fr_1.2fr]"><form (ngSubmit)="stage()" class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"><h2 class="text-xl font-semibold">Stage a source</h2><input [(ngModel)]="title" name="title" required placeholder="Source title" class="mt-4 w-full rounded-lg border px-3 py-2"><select [(ngModel)]="audience" name="audience" class="mt-3 w-full rounded-lg border px-3 py-2"><option value="public">Public customer knowledge</option><option value="internal">Internal operator knowledge</option></select><textarea [(ngModel)]="content" name="content" required rows="12" placeholder="Python ingestion output or approved text" class="mt-3 w-full rounded-lg border px-3 py-2"></textarea><button class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white">Stage for review</button></form><section class="rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200"><div class="flex items-center justify-between"><h2 class="text-xl font-semibold">Source catalog</h2><button (click)="loadSources()" class="text-sm text-indigo-600">Refresh</button></div><div *ngFor="let source of sources" class="mt-4 flex items-center justify-between rounded-xl border p-4"><div><p class="font-medium">{{ source.title }}</p><p class="mt-1 text-sm text-slate-500">{{ source.audience }} · {{ source.status }}</p></div><button *ngIf="source.status === 'awaiting_review'" (click)="publish(source)" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white">Publish</button></div></section></section>
  <p *ngIf="error" role="alert" class="mt-6 rounded-lg bg-rose-50 p-3 text-rose-700">{{ error }}</p>
</main>
