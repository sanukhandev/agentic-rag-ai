name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://agentic:agentic_local_only@127.0.0.1:54329/agentic_rag
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentic_rag
          POSTGRES_USER: agentic
          POSTGRES_PASSWORD: agentic_local_only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U agentic -d agentic_rag"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply PostgreSQL migrations
        shell: bash
        env:
          PGPASSWORD: agentic_local_only
        run: for migration in infra/postgres/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Tracked secret guard
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.(local|development|staging|production))'; then
            echo 'A non-example environment file is tracked.'
            exit 1
          fi
          if git grep -nE '(AZURE_AI_API_KEY|N8N_WEBHOOK_SECRET|PII_VAULT_KEY|INGESTION_WORKER_SECRET)=[^[:space:]]{8,}' -- ':!.env.example'; then
            echo 'A likely secret assignment is present in tracked files.'
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ingestion worker
        shell: bash
        run: |
          python -m venv tools/ingestion/.venv
          tools/ingestion/.venv/bin/python -m pip install --upgrade pip
          tools/ingestion/.venv/bin/python -m pip install -r tools/ingestion/requirements.txt
          tools/ingestion/.venv/bin/python -m unittest discover -s tools/ingestion -p 'test_*.py' -v
