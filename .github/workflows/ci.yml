name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ingestion worker
        shell: bash
        run: |
          python -m venv tools/ingestion/.venv
          tools/ingestion/.venv/bin/python -m pip install --upgrade pip
          tools/ingestion/.venv/bin/python -m pip install -r tools/ingestion/requirements.txt
          tools/ingestion/.venv/bin/python -m unittest discover -s tools/ingestion -p 'test_*.py' -v
