name: New architecture validation

on:
  push:
    branches: [refactor/clean-architecture-rebuild]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node contracts, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run verify:conversation-boundary
      - run: npm run verify:compose
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build --workspaces --if-present
      - run: node --test infra/n8n/workflows/*.test.mjs
  python:
    name: Python gateway unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
        working-directory: services/model-gateway
      - run: python -m pytest -q tests
        working-directory: services/model-gateway
      - run: python -m pip install -r tools/ingestion/requirements.txt
      - run: PYTHONPATH=tools/ingestion python -m unittest discover -s tools/ingestion -p 'test_*.py'
