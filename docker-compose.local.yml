# LOCAL DEVELOPMENT ONLY. Combine with docker-compose.yml; never deploy this
# override on a public host. Database ports bind only to 127.0.0.1.
services:
  postgres:
    ports:
      - "127.0.0.1:${LOCAL_POSTGRES_PORT:-55432}:5432"

  postgres-p2-test:
    profiles: [p2-test]
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    restart: "no"
    environment:
      POSTGRES_DB: agentic_rag_p2_test
      POSTGRES_USER: agentic_p2
      POSTGRES_PASSWORD: ${P2_TEST_POSTGRES_PASSWORD:?Set P2_TEST_POSTGRES_PASSWORD in .env for local testing}
    ports:
      - "127.0.0.1:${P2_TEST_POSTGRES_PORT:-55433}:5432"
    volumes:
      - p2_test_postgres:/var/lib/postgresql/data:rw
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U agentic_p2 -d agentic_rag_p2_test"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24

volumes:
  p2_test_postgres:
